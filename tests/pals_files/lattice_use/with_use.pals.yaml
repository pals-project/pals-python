# Two lattices and a use entry: use overrides the last-lattice default,
# selecting lat1.
PALS:
  facility:
    - line1:
        kind: BeamLine
        line:
          - m1:
              kind: Marker
    - lat1:
        kind: Lattice
        branches:
          - line1
    - lat2:
        kind: Lattice
        branches:
          - line1
    - use: "lat1"
