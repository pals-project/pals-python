# Two lattices and no use entry: per the standard's use statement, the
# last lattice defined (lat2) is the one instantiated.
PALS:
  facility:
    - line1:
        kind: BeamLine
        line:
          - m1:
              kind: Marker
    - lat1:
        kind: Lattice
        branches:
          - line1
    - lat2:
        kind: Lattice
        branches:
          - line1
