name: pals

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.ref }}-${{ github.head_ref }}-standard-examples
  cancel-in-progress: true

permissions:
    contents: read  # access to check out code and install dependencies

jobs:
  standard-examples:
    name: standard examples
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      # The standard is validated at a pinned commit (bumped by the
      # weekly_update workflow), so changes to it cannot break unrelated PRs.
      - name: Read the pinned PALS standard commit
        id: pin
        run: |
          sha=$(grep -vE '^[[:space:]]*(#|$)' tests/pals_standard_ref.txt | head -n1)
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
      - name: Checkout PALS repository
        uses: actions/checkout@v7
        with:
          repository: pals-project/pals
          ref: ${{ steps.pin.outputs.sha }}
          path: pals_temp
          fetch-depth: 1
          sparse-checkout: |
            examples/
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install ".[test]"
      - name: Run standard examples
        run: |
          python tests/validate_standard_examples.py \
            --root pals_temp/examples \
            --known-failures tests/standard_examples_known_failures.txt
